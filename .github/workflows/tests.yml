name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: pip install -r requirements-dev.txt

      - name: Test
        run: python -m pytest tests/ -q

      - name: Solve a week end to end
        run: python scripts/solve.py --agents 24 --time 30 --quiet

      - name: Forecast a week end to end
        run: python scripts/forecast.py --weeks 20
